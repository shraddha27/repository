services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catalogue_async
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue_async"]
      interval: 5s
      timeout: 3s
      retries: 10
